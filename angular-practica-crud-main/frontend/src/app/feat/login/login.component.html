<section class="login">
  <div class="login-card">
    <h1>Iniciar sesión</h1>

<form
  [formGroup]="formulario"
  (ngSubmit)="iniciarSesion()"
  novalidate
>
<div class="campo">
  <label for="email">Correo electrónico</label>

  <input
    id="email"
    type="email"
    formControlName="email"
    autocomplete="email"
    placeholder="correo@ejemplo.com"
    [class.input-error]="formulario.get('email')?.invalid"
  />

  <div
    *ngIf="formulario.get('email')?.invalid"
    class="error-campo"
    role="alert"
  >
    <span *ngIf="formulario.get('email')?.hasError('required')">
      El correo electrónico es obligatorio.
    </span>

    <span *ngIf="formulario.get('email')?.hasError('email')">
      Introduce un correo electrónico válido.
    </span>
  </div>
</div>


  <div class="campo">
    <label for="password">Contraseña</label>

    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="Contraseña"
    />

    <p
      *ngIf="
        formulario.get('password')?.hasError('required') &&
        (formulario.get('password')?.touched || enviado)
      "
      class="error-campo"
      role="alert"
    >
      La contraseña es obligatoria.
    </p>
  </div>

  <p *ngIf="errorLogin" class="mensaje-error-login" role="alert">
    {{ errorLogin }}
  </p>

  <button type="submit" [disabled]="loading">
    {{ loading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
  </button>
</form>


  </div>
</section>
