<section class="coches">
  <div class="title">
  <h1 class="textTitle">Listado de coches</h1>
  <a routerLink="/" aria-label="Ir a Home" class="homeIcon">  
<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>home</title><path fill="currentColor" d="M4 21V9l8-6l8 6v12h-6v-7h-4v7z"/></svg>  </a>
</div>
<div *ngIf="loading">
<h1>Cargando...</h1>
</div>
<div class="container" *ngIf="!loading">
  <table class="tabla-coches">
    <thead>
      <tr>
        <th>Imagen</th>
        <th> 
          <button
        type="button"
        class="ordenable"
        (click)="ordenarPor('marca')"
        [attr.aria-sort]="campoOrdenado === 'marca' ? direccionOrden : 'none'"
      >
        Marca
        <span *ngIf="campoOrdenado === 'marca'">
          {{ direccionOrden === 'ascending' ? '▲' : '▼' }}
        </span>
      </button></th>
        <th> <button
        type="button"
        class="ordenable"
        (click)="ordenarPor('modelo')"
        [attr.aria-sort]="campoOrdenado === 'modelo' ? direccionOrden : 'none'"
      >
        Modelo
        <span *ngIf="campoOrdenado === 'modelo'">
          {{ direccionOrden === 'ascending' ? '▲' : '▼' }}
        </span>
      </button></th>
        <th> <button
        type="button"
        class="ordenable"
        (click)="ordenarPor('total')"
        [attr.aria-sort]="campoOrdenado === 'total' ? direccionOrden : 'none'"
      >
        Total
        <span *ngIf="campoOrdenado === 'total'">
          {{ direccionOrden === 'ascending' ? '▲' : '▼' }}
        </span>
      </button></th>
      <th >Ir al detalle</th>
          <th>
        <a [routerLink]="['/cars/new']">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>add</title><path fill="currentColor" d="M11 13H5v-2h6V5h2v6h6v2h-6v6h-2z"/></svg>
        </a>
      </th>
    </tr>

    </thead>

    <tbody class="celdas">
      <tr *ngFor="let coche of coches">
        <td class="image" data-label="Imagen">
          <img
            [ngSrc]="coche.imageUrl"
            [alt]="coche.brand.name + ' ' + coche.model.name"
            width="100"
            height="70"
            priority
          />
        </td>
        <td class="marca" data-label="Marca">{{ coche.brand.name }}</td>
        <td data-label="Modelo">{{ coche.model.name }}</td>
        <td data-label="Total">{{ coche.total }}</td>
        <td data-label="Ir al detalle" class="detalle">
          <a [routerLink]="['/cars', coche.id]">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>arrow-right</title><path fill="#000000" d="M4 11v2h12l-5.5 5.5l1.42 1.42L19.84 12l-7.92-7.92L10.5 5.5L16 11z"/></svg>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
  <p *ngIf="!loading && !error && coches.length === 0">
    No hay coches disponibles.
  </p>
</section>
